# KrissOS Limine theme. Generated from theme/tokens.json; do not edit.
# These are global options: kriss-limine-update (kriss-settings) puts them above the
# boot entries in limine.conf, with the wallpaper line. Palette order: black, red,
# green, yellow, blue, magenta, cyan, white.
interface_branding: KrissOS
interface_branding_colour: {{accent.hex}}
interface_help_colour: {{muted.hex}}
# centered, not stretched: Limine scales pixel by pixel, which took 38 s on a 1440p
# screen. kriss-limine-update picks the wallpaper PNG made for the screen size.
wallpaper_style: centered
backdrop: {{bg.hex}}
# TTRRGGBB: the menu panel lets the wallpaper show through.
term_background: 60{{bg.hex}}
term_foreground: {{fg.hex}}
term_background_bright: {{surface.hex}}
term_foreground_bright: {{fg.hex}}
term_margin: 96
term_margin_gradient: 16
term_palette: {{color0.hex}};{{color1.hex}};{{color2.hex}};{{color3.hex}};{{color4.hex}};{{color5.hex}};{{color6.hex}};{{color7.hex}}
term_palette_bright: {{color8.hex}};{{color9.hex}};{{color10.hex}};{{color11.hex}};{{color12.hex}};{{color13.hex}};{{color14.hex}};{{color15.hex}}
