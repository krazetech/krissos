<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- KrissOS default fonts. Generated from theme/tokens.json; do not edit. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>{{font_sans}}</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>{{font_sans}}</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>{{font_mono}}</family></prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <prefer><family>{{font_mono}}</family></prefer>
  </alias>

  <!-- Web pages and Electron apps that ask for the Mac system fonts get ours. -->
  <alias binding="same"><family>-apple-system</family><prefer><family>{{font_sans}}</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>{{font_sans}}</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>{{font_sans}}</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>{{font_sans}}</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>{{font_sans}}</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>{{font_mono}}</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>{{font_mono}}</family></prefer></alias>

  <!-- Rendered like macOS: grey smoothing with no coloured LCD fringes, light hinting
       that keeps the letter shapes, no blocky embedded bitmaps. Stem darkening, which
       gives the Mac's slightly heavier text, is in environment.d/60-kriss-fonts.conf. -->
  <match target="font">
    <edit mode="assign" name="antialias"><bool>true</bool></edit>
    <edit mode="assign" name="hinting"><bool>true</bool></edit>
    <edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
    <edit mode="assign" name="rgba"><const>none</const></edit>
    <edit mode="assign" name="lcdfilter"><const>lcdnone</const></edit>
    <edit mode="assign" name="embeddedbitmap"><bool>false</bool></edit>
  </match>
</fontconfig>
