# Hand the KrissOS splash over to the login screen without a flash: tell the theme to
# fade to its background, give it the 0.3 s, then quit keeping that last frame on screen
# until the compositor draws (cosmic-comp-kriss clears to the same black). greetd starts
# after this, through plymouth-quit-wait.
[Service]
ExecStart=
ExecStart=-/usr/bin/sh -c 'plymouth update --status=kriss-fade && sleep 0.35'
ExecStart=-/usr/bin/plymouth quit --retain-splash
