    </linearGradient>
    <!-- Bounding-box units in the traced path's own space, which is y-up: 0 is the foot. -->
    <linearGradient id="keris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{accent}}" stop-opacity="0"/>
      <stop offset="0.45" stop-color="{{accent}}" stop-opacity="0.16"/>
