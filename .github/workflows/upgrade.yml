name: upgrade

# A released ISO, installed, reaches main with kriss update (tools/ci/upgrade-test.sh).
on:
  pull_request:
    paths: ['tools/ci/upgrade-test.sh', '.github/workflows/upgrade.yml']
  schedule:
    - cron: '0 5 * * 1'      # weekly, after the nightly ISO
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        tag: ['0.1-alpha']   # preview has no ISO asset to download
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the test reads the tag's own scripted install
      - name: QEMU with KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf libarchive-tools
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/upgrade-test.sh ${{ matrix.tag }} upgrade-test
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-${{ matrix.tag }}
          path: upgrade-test/*.log
          if-no-files-found: ignore
