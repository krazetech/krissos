name: pages
# Deploys site/ to https://krazetech.github.io/krissos/ (Pages source: GitHub Actions).
# Custom domain later: set it in Settings > Pages and add a DNS CNAME to krazetech.github.io.
# Paths in site/ are relative, so they work under /krissos/ and at a domain root.

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
