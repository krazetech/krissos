name: image-aarch64

# The Apple Silicon image (ARCHITECTURE §13), built on GitHub's free arm64 runners.
# generic: boots in a QEMU `virt` VM (UEFI) until the KrissOS Shell starts.
# asahi: built for the Asahi installer; Apple hardware cannot be emulated, so not booted.
on:
  push:
    branches: [main]
    paths: ['aarch64/**', 'pkgs/kriss-*/**', 'shell/**', 'theme/**', 'tools/**', '.github/workflows/image-aarch64.yml']
  pull_request:
    paths: ['aarch64/**', 'pkgs/kriss-*/**', 'shell/**', 'theme/**', 'tools/**', '.github/workflows/image-aarch64.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-aarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        flavour: [generic, asahi]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Make the Arch Linux ARM container
        run: tools/ci/alarm.sh

      # arch-chroot needs mounts, so the container must be privileged.
      - name: Build the ${{ matrix.flavour }} image
        id: build
        run: |
          df -h /
          docker run --rm --privileged -v "$PWD:/src" -v "$RUNNER_TEMP:/work" alarm \
            /src/aarch64/build.sh /src/out /work ${{ matrix.flavour }}
          sudo chown -R "$USER" out
          df -h /

      - name: Boot test
        if: matrix.flavour == 'generic'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-arm qemu-efi-aarch64 ipxe-qemu socat
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          aarch64/boot-test.sh out/krissos-aarch64-generic.img boot-test

      - name: Upload boot test
        if: always() && matrix.flavour == 'generic'
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-aarch64
          path: boot-test/
          if-no-files-found: ignore

      # Also when the boot test fails, so the image can be tried by hand.
      - name: Upload image
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: krissos-aarch64-${{ matrix.flavour }}
          path: out/
          retention-days: 7
