name: packages

on:
  push:
    branches: [main]
    paths: ['pkgs/**', '!pkgs/linux-kriss/**', '!pkgs/linux-kriss-asahi/**', 'tools/**', 'shell/**', 'theme/**', 'installer/**', '.github/workflows/pkgs.yml']
  pull_request:
    paths: ['pkgs/**', '!pkgs/linux-kriss/**', '!pkgs/linux-kriss-asahi/**', 'tools/**', 'shell/**', 'theme/**', 'installer/**', '.github/workflows/pkgs.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    # Runs that publish share one group with kernel.yml's publish job, so only one of them
    # edits the repo db at a time.
    # ponytail: GitHub keeps one pending run per group and cancels older pending ones.
    # A cancelled publish is fixed by re-running that job; move to a retry loop on the db
    # upload if that ever gets common.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'repo-x86_64' || format('pkgs-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      # multilib lets the metapackage check below resolve Steam and the lib32 packages.
      - name: Install build tools
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git github-cli shellcheck

      - uses: actions/checkout@v4

      - name: Lint tools
        run: shellcheck tools/kriss tools/kriss-update-notify tools/ci/*.sh aarch64/*.sh installer/kriss-install installer/lib/* pkgs/kriss-settings/root/usr/bin/kriss-limine-update

      - name: Test the publish script
        run: tools/ci/publish-test.sh

      - name: Test kriss tune
        run: tools/ci/tune-test.sh

      # The kernels are built by kernel.yml and kernel-asahi.yml.
      - name: Build packages
        run: tools/ci/build-pkgs.sh out $(ls -d pkgs/*/ | grep -v '^pkgs/linux-kriss')

      - name: Sign and publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KRISS_GPG_KEY: ${{ secrets.KRISS_GPG_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: tools/ci/publish.sh out

  # The architecture-neutral packages again, on Arch Linux ARM, for the Apple Silicon image
  # (ARCHITECTURE §13). Left out: calamares and kriss-installer (the Asahi installer does
  # that job), kriss-meta-winapps (WinBoat is x86 only) and kriss-meta-gaming (its lib32
  # and Intel/AMD Vulkan packages do not exist on aarch64; games there go through FEX).
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'repo-aarch64' || format('pkgs-aarch64-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Make the Arch Linux ARM container
        run: tools/ci/alarm.sh

      - name: Build packages
        run: |
          docker run --rm -v "$PWD:/src" -w /src alarm tools/ci/build-pkgs.sh out \
            pkgs/kriss-keyring pkgs/kriss-settings pkgs/kriss-theme pkgs/kriss-tools pkgs/kriss-shell pkgs/kriss-welcome

      - name: Sign and publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KRISS_GPG_KEY: ${{ secrets.KRISS_GPG_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e KRISS_GPG_KEY -e GH_TOKEN -e GH_REPO -e RELEASE_TAG=repo-aarch64 \
            alarm sh -c 'pacman -S --noconfirm --needed github-cli && tools/ci/publish.sh out'
