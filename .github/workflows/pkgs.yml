name: packages

on:
  push:
    branches: [main]
    paths: ['pkgs/**', '!pkgs/linux-kriss/**', 'tools/**', 'shell/**', 'theme/**', 'installer/**', '.github/workflows/pkgs.yml']
  pull_request:
    paths: ['pkgs/**', '!pkgs/linux-kriss/**', 'tools/**', 'shell/**', 'theme/**', 'installer/**', '.github/workflows/pkgs.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    # Runs that publish share one group with kernel.yml's publish job, so only one of them
    # edits the repo db at a time.
    # ponytail: GitHub keeps one pending run per group and cancels older pending ones.
    # A cancelled publish is fixed by re-running that job; move to a retry loop on the db
    # upload if that ever gets common.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'repo-x86_64' || format('pkgs-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      # multilib lets the metapackage check below resolve Steam and the lib32 packages.
      - name: Install build tools
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git github-cli shellcheck

      - uses: actions/checkout@v4

      - name: Lint tools
        run: shellcheck tools/kriss tools/kriss-update-notify tools/ci/*.sh installer/kriss-install installer/lib/* pkgs/kriss-settings/root/usr/bin/kriss-limine-update pkgs/kriss-settings/root/usr/lib/initcpio/post/kriss-limine iso/install-test.sh

      - name: Test the publish script
        run: tools/ci/publish-test.sh

      - name: Test kriss tune
        run: tools/ci/tune-test.sh

      # makepkg refuses to run as root. The kernel is built by kernel.yml.
      - name: Build packages
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder "$GITHUB_WORKSPACE"
          mkdir -p out && chown builder out
          for dir in pkgs/*/; do
            [ "$dir" = pkgs/linux-kriss/ ] && continue
            echo "::group::$dir"
            deps=--syncdeps
            # Metapackages are only a dependency list: check every name resolves, then
            # package without installing the lot.
            case $dir in pkgs/kriss-meta-*)
              (. "$dir/PKGBUILD" && pacman -Sp "${depends[@]}" >/dev/null)
              deps=--nodeps ;;
            esac
            su builder -c "cd '$dir' && PKGDEST='$GITHUB_WORKSPACE/out' makepkg $deps --noconfirm --cleanbuild"
            echo "::endgroup::"
          done
          ls -l out

      - name: Sign and publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KRISS_GPG_KEY: ${{ secrets.KRISS_GPG_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: tools/ci/publish.sh out
