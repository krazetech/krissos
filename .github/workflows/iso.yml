name: iso

on:
  push:
    tags: ['[0-9]*', 'MR*']   # release codenames: 110, 115, MR3
  pull_request:
    paths: ['iso/**', 'installer/**', 'pkgs/calamares/**', 'pkgs/kriss-installer/**', 'pkgs/kriss-settings/**', 'pkgs/kriss-theme/**', 'pkgs/kriss-tools/**', 'theme/**', 'tools/kriss', '.github/workflows/iso.yml']
  schedule:
    - cron: '30 3 * * *'      # nightly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The work dir peaks around 10 GB on top of the ISO. Drop the toolchains we never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      # mkarchiso needs mounts, so the container must be privileged.
      # Tagged releases install from [kriss]; nightly and PR ISOs from [kriss-testing], so
      # their boot and install tests check what promote.yml would move to [kriss] next.
      - name: Build ISO
        id: build
        env:
          KRISS_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'testing' }}
        run: |
          mkdir -p out
          sudo docker run --rm --privileged -e KRISS_CHANNEL -v "$PWD:/src" -v "$RUNNER_TEMP:/work" archlinux:latest \
            /src/iso/build.sh /src/out /work
          sudo chown -R "$USER" out
          cd out && sha256sum -- *.iso > sha256sums.txt
          ls -lh && df -h /

      # ISO hosting is SourceForge (no size limit that matters here). GitHub release assets
      # max out at 2 GiB, so the release steps skip the ISO itself when it is bigger.
      - name: Check ISO size
        run: |
          iso=$(ls out/*.iso)
          size=$(stat -c %s "$iso")
          echo "ISO size: $(basename "$iso") is $size bytes ($(numfmt --to=iec-i "$size"))" | tee -a "$GITHUB_STEP_SUMMARY"
          if (( size > 4294967296 )); then
            echo "::warning::The ISO is over 4 GiB. Check what grew before it gets harder to download."
          fi
          # The release steps then upload everything but the ISO.
          if (( size > 2147483648 )); then echo ISO_OVER_2GIB=1 >>"$GITHUB_ENV"; fi

      - name: Sign
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        env:
          KRISS_GPG_KEY: ${{ secrets.KRISS_GPG_KEY }}
        run: |
          if [ -z "$KRISS_GPG_KEY" ]; then
            echo "::warning::KRISS_GPG_KEY is not set; the ISO was built but not signed."
            exit 0
          fi
          printf '%s\n' "$KRISS_GPG_KEY" | gpg --batch --import
          cd out
          for f in *.iso sha256sums.txt; do
            gpg --batch --yes --local-user 7C92AE8B599AF81321666CA31317AA31B21C5F87 --detach-sign "$f"
          done

      - name: Boot test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf libarchive-tools socat
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          iso/boot-test.sh out/*.iso boot-test

      - name: Upload boot test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: boot-test/
          if-no-files-found: ignore

      # Unattended install onto a QEMU disk with the installer's own scripts, then boot it.
      - name: Install test
        if: always() && steps.build.outcome == 'success'
        run: |
          sudo rm -rf "$RUNNER_TEMP"/{mkarchiso,profile,src,kriss-local,logo}
          df -h /
          iso/install-test.sh out/*.iso install-test

      - name: Upload install test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test
          path: |
            install-test/*.log
            install-test/*.png
          if-no-files-found: ignore

      # Also when a test fails, so the ISO can be tried by hand.
      - name: Upload ISO
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: krissos-iso
          path: out/
          compression-level: 0
          retention-days: 14

      # ISO hosting: SourceForge's file release system, whatever the ISO size. preview/ holds
      # only the latest build (--delete drops older ones); tags go to releases/<tag>/. Forks and
      # PRs have no SF_SSH_KEY, so they skip. The key goes to a 0600 file, never to the log.
      - name: Upload to SourceForge
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          if [ -z "$SF_SSH_KEY" ]; then
            echo "::notice::SF_SSH_KEY is not set; skipping the SourceForge upload."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$SF_SSH_KEY" >~/.ssh/sourceforge)
          ssh-keyscan frs.sourceforge.net >>~/.ssh/known_hosts 2>/dev/null
          export RSYNC_RSH="ssh -i $HOME/.ssh/sourceforge -o IdentitiesOnly=yes -o BatchMode=yes"
          dest=krazetech@frs.sourceforge.net:/home/frs/project/krissos
          if [[ $GITHUB_REF == refs/tags/* ]]; then dir=releases/$GITHUB_REF_NAME; else dir=preview; fi
          # rsync creates only the last directory level, so make the folders first.
          mkdir -p "$RUNNER_TEMP/sf/$dir"
          rsync -rtO "$RUNNER_TEMP/sf/" "$dest/"
          rsync -rtO --delete --progress out/ "$dest/$dir/"
          echo "SourceForge: https://sourceforge.net/projects/krissos/files/$dir/" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s extglob
          files=(out/*)  # the ISO, sha256sums.txt and their .sig files
          if [ "${ISO_OVER_2GIB:-}" = 1 ]; then
            echo "::notice::The ISO is over GitHub's 2 GiB release asset limit, so this release gets only sha256sums.txt and the .sig files. The ISO is on SourceForge and in the workflow artifact."
            files=(out/!(*.iso))
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "KrissOS $GITHUB_REF_NAME" --notes ''
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      # Nightly and manual runs on main refresh the public `preview` pre-release that the website's
      # Download page links to. Only after the boot and install tests pass (steps stop on failure).
      # The ISO name carries the date, so the old assets go first.
      - name: Publish preview
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s extglob
          files=(out/*)  # the ISO, sha256sums.txt and their .sig files
          if [ "${ISO_OVER_2GIB:-}" = 1 ]; then
            echo "::notice::The ISO is over GitHub's 2 GiB release asset limit, so this release gets only sha256sums.txt and the .sig files. The ISO is on SourceForge and in the workflow artifact."
            files=(out/!(*.iso))
          fi
          if ! gh release view preview >/dev/null 2>&1; then
            gh release create preview --prerelease --target main --title 'KrissOS preview' \
              --notes 'Latest nightly build from main. For testing in a VM or on spare hardware.'
          fi
          for a in $(gh release view preview --json assets -q '.assets[].name'); do
            gh release delete-asset preview "$a" --yes
          done
          gh release upload preview "${files[@]}" --clobber
