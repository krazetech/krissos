name: iso

on:
  push:
    tags: ['[0-9]*', 'MR*']   # release codenames: 110, 115, MR3
  pull_request:
    paths: ['iso/**', 'installer/**', 'pkgs/calamares/**', 'pkgs/kriss-installer/**', '.github/workflows/iso.yml']
  schedule:
    - cron: '30 3 * * *'      # nightly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The work dir peaks around 10 GB on top of the ISO. Drop the toolchains we never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      # mkarchiso needs mounts, so the container must be privileged.
      - name: Build ISO
        id: build
        run: |
          mkdir -p out
          sudo docker run --rm --privileged -v "$PWD:/src" -v "$RUNNER_TEMP:/work" archlinux:latest \
            /src/iso/build.sh /src/out /work
          sudo chown -R "$USER" out
          cd out && sha256sum -- *.iso > sha256sums.txt
          ls -lh && df -h /

      # GitHub release assets max out at 2 GiB; the release step enforces it.
      - name: Check ISO size
        run: |
          iso=$(ls out/*.iso)
          size=$(stat -c %s "$iso")
          echo "ISO size: $(basename "$iso") is $size bytes ($(numfmt --to=iec-i "$size"))" | tee -a "$GITHUB_STEP_SUMMARY"
          if (( size > 1932735283 )); then
            echo "::warning::The ISO is over 1.8 GiB and nearing the 2 GiB release asset limit."
          fi

      - name: Sign
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')
        env:
          KRISS_GPG_KEY: ${{ secrets.KRISS_GPG_KEY }}
        run: |
          if [ -z "$KRISS_GPG_KEY" ]; then
            echo "::warning::KRISS_GPG_KEY is not set; the ISO was built but not signed."
            exit 0
          fi
          printf '%s\n' "$KRISS_GPG_KEY" | gpg --batch --import
          cd out
          for f in *.iso sha256sums.txt; do
            gpg --batch --yes --local-user 7C92AE8B599AF81321666CA31317AA31B21C5F87 --detach-sign "$f"
          done

      - name: Boot test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf libarchive-tools socat
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          iso/boot-test.sh out/*.iso boot-test

      - name: Upload boot test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: boot-test/
          if-no-files-found: ignore

      # Unattended install onto a QEMU disk with the installer's own scripts, then boot it.
      - name: Install test
        if: always() && steps.build.outcome == 'success'
        run: |
          sudo rm -rf "$RUNNER_TEMP"/{mkarchiso,profile,src,kriss-local,logo}
          df -h /
          iso/install-test.sh out/*.iso install-test

      - name: Upload install test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test
          path: |
            install-test/*.log
            install-test/*.png
          if-no-files-found: ignore

      # Also when a test fails, so the ISO can be tried by hand.
      - name: Upload ISO
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: krissos-iso
          path: out/
          compression-level: 0
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          size=$(stat -c %s out/*.iso)
          if (( size > 2147483648 )); then
            echo "::error::The ISO is $size bytes, over GitHub's 2 GiB release asset limit. It is still in the workflow artifact. Move ISO hosting off GitHub Releases (planned: Cloudflare R2) before tagging again."
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "KrissOS $GITHUB_REF_NAME" --notes ''
          gh release upload "$GITHUB_REF_NAME" out/* --clobber  # the ISO, sha256sums.txt and their .sig files
