name: iso

on:
  push:
    tags: ['[0-9]*', 'MR*']   # release codenames: 110, 115, MR3
  pull_request:
    paths: ['iso/**', '.github/workflows/iso.yml']
  schedule:
    - cron: '30 3 * * *'      # nightly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The work dir peaks around 10 GB on top of the ISO. Drop the toolchains we never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      # mkarchiso needs mounts, so the container must be privileged.
      - name: Build ISO
        run: |
          mkdir -p out
          sudo docker run --rm --privileged -v "$PWD:/src" -v "$RUNNER_TEMP:/work" archlinux:latest \
            /src/iso/build.sh /src/out /work
          sudo chown -R "$USER" out
          cd out && sha256sum ./*.iso > "$(basename ./*.iso).sha256"
          ls -lh && df -h /

      - name: Boot test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf libarchive-tools socat
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          iso/boot-test.sh out/*.iso boot-test

      - name: Upload boot test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: boot-test/
          if-no-files-found: ignore

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: krissos-iso
          path: out/
          compression-level: 0
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "KrissOS $GITHUB_REF_NAME" --notes ''
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
