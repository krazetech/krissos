name: cosmic-comp

# cosmic-comp-kriss and cosmic-settings-kriss are full Rust builds, so they have their own
# workflow instead of rebuilding with every change under pkgs/.
on:
  push:
    branches: [main]
    paths: ['pkgs/cosmic-comp-kriss/**', 'pkgs/cosmic-settings-kriss/**', '.github/workflows/cosmic-comp.yml']
  pull_request:
    paths: ['pkgs/cosmic-comp-kriss/**', 'pkgs/cosmic-settings-kriss/**', '.github/workflows/cosmic-comp.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmic-comp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        pkg: [cosmic-comp-kriss, cosmic-settings-kriss]
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - name: Build ${{ matrix.pkg }}
        run: tools/ci/build-pkgs.sh out pkgs/${{ matrix.pkg }}

      # Kept a week, so a PR's build can be tried on a test machine before it is merged.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: out/*.pkg.tar.zst
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    # Shared with pkgs.yml and kernel.yml; see the note in pkgs.yml.
    concurrency:
      group: repo-x86_64
      cancel-in-progress: false
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: cosmic-*-kriss
          merge-multiple: true
          path: out

      - name: Sign and publish
        env:
          KRISS_GPG_KEY: ${{ secrets.KRISS_GPG_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: tools/ci/publish.sh out
