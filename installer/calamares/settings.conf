# KrissOS installer sequence. Installed to /etc/calamares/ by kriss-installer; module
# configs not in modules/ fall back to Calamares' defaults in /usr/share/calamares.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: desktop
  module: packagechooser
  config: packagechooser-desktop.conf
- id: pacstrap
  module: shellprocess
  config: shellprocess-pacstrap.conf
- id: configure
  module: shellprocess
  config: shellprocess-configure.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - packagechooser@desktop
  - users
  - summary
- exec:
  - partition
  - mount
  - shellprocess@pacstrap
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - shellprocess@configure
  - umount
- show:
  - finished

branding: krissos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
