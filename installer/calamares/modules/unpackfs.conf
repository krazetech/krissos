# Copy the live system to the target: everything installs from the USB, no internet.
# archiso mounts the live squashfs read-only here (also with copytoram), under the
# writable overlay, so this is the image as built. unlive then removes the live-only bits.
---
unpack:
    - source: /run/archiso/airootfs/
      sourcefs: file
      destination: ""
