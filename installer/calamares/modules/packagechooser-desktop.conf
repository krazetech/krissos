# The desktop picker. The choice lands in Global Storage as packagechooser_desktop,
# which the pacstrap and configure steps read.
---
mode: required
method: legacy
labels:
    step: "Desktop"
    step[ms]: "Desktop"
default: shell
items:
    - id: shell
      name: "KrissOS Shell"
      name[ms]: "KrissOS Shell"
      description: "The KrissOS desktop: a floating taskbar, a Start-style launcher on the Windows key and quick settings, all in the KrissOS look. Recommended."
      description[ms]: "Desktop KrissOS: bar tugas terapung, pelancar gaya Start pada kekunci Windows dan tetapan pantas, semuanya dalam rupa KrissOS. Disyorkan."
    - id: plasma
      name: "KDE Plasma"
      name[ms]: "KDE Plasma"
      description: "KDE Plasma with the KrissOS colours, wallpaper and login screen. More settings and widgets, and the familiar KDE apps."
      description[ms]: "KDE Plasma dengan warna, kertas dinding dan skrin log masuk KrissOS. Lebih banyak tetapan dan widget, serta aplikasi KDE yang biasa."
