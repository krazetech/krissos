# The desktop picker. The choice lands in Global Storage as packagechooser_desktop,
# which the online step reads.
---
mode: required
method: legacy
labels:
    step: "Desktop"
    step[ms]: "Desktop"
default: shell
items:
    - id: shell
      name: "KrissOS Shell"
      name[ms]: "KrissOS Shell"
      description: "The KrissOS desktop: a floating taskbar, a Start-style launcher on the Windows key and quick settings, all in the KrissOS look. Recommended."
      description[ms]: "Desktop KrissOS: bar tugas terapung, pelancar gaya Start pada kekunci Windows dan tetapan pantas, semuanya dalam rupa KrissOS. Disyorkan."
    - id: plasma
      name: "KDE Plasma (needs internet)"
      name[ms]: "KDE Plasma (perlu internet)"
      description: "KDE Plasma with the KrissOS colours, wallpaper and login screen. More settings and widgets, and the familiar KDE apps. Plasma is not on the USB, so it downloads during the install. Without internet, KrissOS installs the KrissOS Shell instead; you can add Plasma later. Pick the KrissOS Shell if you are offline."
      description[ms]: "KDE Plasma dengan warna, kertas dinding dan skrin log masuk KrissOS. Lebih banyak tetapan dan widget, serta aplikasi KDE yang biasa. Plasma tiada dalam USB, jadi ia dimuat turun semasa pemasangan. Tanpa internet, KrissOS memasang KrissOS Shell sebagai ganti; anda boleh menambah Plasma kemudian. Pilih KrissOS Shell jika anda tiada internet."
