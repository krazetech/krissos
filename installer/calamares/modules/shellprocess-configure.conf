# Snapper, Limine (with Windows and snapshots in the menu), initramfs and services.
---
dontChroot: true
timeout: 900
verbose: true
script:
    - "/usr/lib/kriss-installer/configure ${ROOT} ${gs[packagechooser_desktop]}"
i18n:
    name: "Setting up the boot menu and snapshots"
    name[ms]: "Menyediakan menu but dan snapshot"
