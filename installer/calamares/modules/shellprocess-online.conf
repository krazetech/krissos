# Optional, only with internet: the faster kernel, updates and KDE Plasma. Offline this
# step does nothing and the install carries on.
---
dontChroot: true
timeout: 3600
verbose: true
script:
    - "/usr/lib/kriss-installer/online ${ROOT} ${gs[packagechooser_desktop]}"
i18n:
    name: "Getting updates (when online)"
    name[ms]: "Mendapatkan kemas kini (jika ada internet)"
