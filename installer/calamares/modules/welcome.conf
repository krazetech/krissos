# Everything installs from the USB. The internet is checked only to say whether the
# optional extras (updates, the faster kernel, KDE Plasma) will be fetched.
---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
requirements:
    requiredStorage: 20
    requiredRam: 2.0
    internetCheckUrl: https://geo.mirror.pkgbuild.com
    check: [ storage, ram, power, internet, root, screen ]
    required: [ storage, ram, root ]
geoip:
    style: none
