# Download and install the base system, kernel, drivers and the chosen desktop.
---
dontChroot: true
timeout: 3600
verbose: true
script:
    - "/usr/lib/kriss-installer/pacstrap ${ROOT} ${gs[packagechooser_desktop]}"
i18n:
    name: "Downloading and installing KrissOS"
    name[ms]: "Memuat turun dan memasang KrissOS"
