# Dual-boot alongside Windows by default; erase the disk is the other choice.
# Limine reads only FAT, so the kernels go on their own FAT32 /boot (XBOOTLDR) and the
# ESP, mounted at /efi, holds just Limine. That works on Windows' small ESP too.
# The launcher (kriss-install) stops before this page if BitLocker is on.
---
efi:
    mountPoint: /efi
    recommendedSize: 512MiB
    minimumSize: 32MiB
    label: EFI
requiredPartitionTableType: gpt
initialPartitioningChoice: alongside
# ponytail: zram (set up by the installer) instead of swap, so no hibernation. Add
# `file` here if people ask for it.
userSwapChoices: [ none ]
initialSwapChoice: none
# "Encrypt system" on the partition page, like BitLocker: it puts / in LUKS2 and asks for
# the passphrase at every boot. Off until the person ticks it, because a lost passphrase
# means lost files. Limine cannot unlock LUKS, so KRISSBOOT stays plain (noEncrypt) and
# the configure step adds the encrypt hook and cryptdevice= when / is encrypted.
# Calamares checks only that the two passphrase boxes match, not their length.
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
luksGeneration: luks2
# Manual partitioning could leave out the FAT32 /boot that Limine needs.
allowManualPartitioning: false
defaultFileSystemType: btrfs
availableFileSystemTypes: [ btrfs ]
drawNestedPartitions: false
alwaysShowPartitionLabels: true
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: false
partitionLayout:
    - name: KRISSBOOT
      type: bc13c2ff-59e6-4262-a352-b275fd6f7172
      filesystem: fat32
      mountPoint: /boot
      size: 2GiB
      noEncrypt: true
    - name: KrissOS
      filesystem: btrfs
      mountPoint: /
      size: 100%
      minSize: 18GiB
