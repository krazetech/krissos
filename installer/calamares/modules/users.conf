---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - audio
    - video
    - lp
    - network
    - storage
sudoersGroup: wheel
sudoersConfigureWithGroup: false
# Root stays locked; the first user gets sudo, as on Windows' first admin account.
setRootPassword: false
doReusePassword: false
doAutologin: false
displayAutologin: false
# This password also unlocks sudo, so no "use a weak password anyway" box. Length only:
# libpwquality's dictionary checks would turn away passphrases people can remember.
passwordRequirements:
    minLength: 8
    maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "krissos"
  forbidden_names: [ localhost ]
