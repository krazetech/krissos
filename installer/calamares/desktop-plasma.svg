<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- The desktop picker's picture of KDE Plasma: a full-width panel with the launcher on
       the left and the clock on the right. Rendered from theme/tokens.json. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{bg}}"/>
      <stop offset="1" stop-color="{{color4}}" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="c"><rect width="800" height="500" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="800" height="500" fill="{{bg}}"/>
    <rect width="800" height="500" fill="url(#sky)"/>
    <rect x="150" y="60" width="500" height="300" rx="10" fill="{{surface}}" stroke="{{fg}}" stroke-opacity="0.12"/>
    <circle cx="626" cy="82" r="7" fill="{{color1}}"/>
    <circle cx="604" cy="82" r="7" fill="{{fg}}" fill-opacity="0.3"/>
    <circle cx="582" cy="82" r="7" fill="{{fg}}" fill-opacity="0.3"/>
    <rect x="176" y="120" width="220" height="14" rx="7" fill="{{fg}}" fill-opacity="0.5"/>
    <rect x="176" y="150" width="420" height="10" rx="5" fill="{{fg}}" fill-opacity="0.2"/>
    <rect x="176" y="170" width="380" height="10" rx="5" fill="{{fg}}" fill-opacity="0.2"/>
    <rect x="0" y="448" width="800" height="52" fill="{{surface}}" fill-opacity="0.95"/>
    <rect x="16" y="458" width="32" height="32" rx="6" fill="{{color4}}"/>
    <rect x="64" y="458" width="32" height="32" rx="6" fill="{{fg}}" fill-opacity="0.3"/>
    <rect x="108" y="458" width="32" height="32" rx="6" fill="{{fg}}" fill-opacity="0.3"/>
    <rect x="152" y="458" width="32" height="32" rx="6" fill="{{fg}}" fill-opacity="0.3"/>
    <rect x="690" y="469" width="92" height="10" rx="5" fill="{{fg}}" fill-opacity="0.4"/>
  </g>
</svg>
