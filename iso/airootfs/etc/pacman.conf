# pacman.conf for the ISO build and for the live system. iso/profiledef.sh points here.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# The key ships in kriss-keyring and is trusted by `pacman-key --populate`.
[kriss]
SigLevel = Required
Server = https://github.com/krazetech/krissos/releases/download/repo-x86_64
