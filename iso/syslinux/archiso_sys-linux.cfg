LABEL kriss
TEXT HELP
Boot the KrissOS live system with the KrissOS Shell.
ENDTEXT
MENU LABEL KrissOS live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-kriss-generic
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-kriss-generic.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL kriss-install
TEXT HELP
Boot the KrissOS live system and open the installer.
ENDTEXT
MENU LABEL Install KrissOS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-kriss-generic
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-kriss-generic.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% kriss.install
