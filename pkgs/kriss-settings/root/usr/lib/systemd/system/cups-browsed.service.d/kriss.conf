# KrissOS: cups-browsed finds network printers over DNS-SD (Avahi) only. The legacy CUPS
# browsing protocol, which listened on UDP 631 for any host's printer announcements (the
# 2024 cups-browsed remote bug path), stays off, and this PC announces no printers.
# It needs cups.socket, not cups.service, so CUPS still starts only when something asks.
[Unit]
Requires=
Requires=cups.socket
After=cups.socket

[Service]
ExecStart=
ExecStart=/usr/bin/cups-browsed -o BrowseRemoteProtocols=dnssd -o BrowseLocalProtocols=none
